<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Markdown解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- XSS过滤 -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <!-- Prism代码高亮 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
      <style>
        body {
          height: 100vh;
          overflow: auto;
        }
    #content {
      width: 90%;
      margin: 0 auto;
      border: 1px solid #eee;
      border-radius: 10px;
      height: 100vh;
      overflow-y: auto;
      line-height: 1.7;
      font-size: 15px;
      color: #222;
    }
    /* MD通用样式 */
    #content h1 { font-size: 24px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    #content h2 { font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    #content h3 { font-size: 17px; margin-top: 1.2em; }
    #content p { margin: 10px 0; }
    #content ul, #content ol { padding-left: 24px; margin: 8px 0; }
    #content li { margin: 4px 0; }
    /* 行内代码 */
    #content code:not(pre code) {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
      color: #dd4a68;
    }
    /* 代码块 */
    #content pre {
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 14px 0;
    }
    #content blockquote {
      border-left: 4px solid #409eff;
      padding: 8px 14px;
      background: #f8f9fa;
      color: #555;
      margin: 12px 0;
    }
    #content table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
    }
    #content th, #content td {
      border: 1px solid #ddd;
      padding: 8px 12px;
    }
    #content th { background: #f5f7fa; }
    </style>
  </head>
  <body>
    <div id="content">1111</div>
    <script>
      marked.setOptions({
        gfm: true,
        breaks: true, // 回车自动换行
        highlight: function (code, lang) {
          if (Prism.languages[lang]) {
            return Prism.highlight(code, Prism.languages[lang], lang);
          }
          return code;
        },
      });

      // 工具：md转安全html
      function mdToHtml(mdStr) {
        const rawHtml = marked.parse(mdStr);
        return DOMPurify.sanitize(rawHtml);
      }
      async function streamChat(question) {
        let fullMarkdown = "";
        const contentBox = document.getElementById("content");
         contentBox.innerHTML = '';
        const res = await fetch("http://127.0.0.1:3000/api/stream", {
          method: "post",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value);
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";
          for (const chunk of chunks) {
            if (!chunk.startsWith("data:")) continue;
            const data = JSON.parse(chunk.slice(5));
            if (data.done) {
              return;
            }
            // 累加每一段markdown内容
            fullMarkdown += data.content;
            // 转换并渲染
            const html = mdToHtml(fullMarkdown);
            contentBox.innerHTML = html;
            // 自动滚动到底部
            contentBox.scrollTop = contentBox.scrollHeight;
            // dom.textContent += data.content;
          }
        }
      }
      streamChat("langchain.js是什么?langgraph.js是什么?");
    </script>
  </body>
</html>
